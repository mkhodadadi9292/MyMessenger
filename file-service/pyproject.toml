[project]
name = "file-service"
version = "0.1.0"
description = "Resumable chunked uploads for the messenger; announces verified files over Redis Streams"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.30.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
    "testcontainers>=4.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
markers = [
    "redis: needs a real Redis (testcontainers or TEST_REDIS_URL)",
    "postgres: needs a real Postgres (testcontainers or TEST_POSTGRES_URL)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Path"]
