server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend container
    location /api/ {
        client_max_body_size 25m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # FastAPI interactive docs -> backend container
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # WebSocket realtime -> backend container
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Chunked uploads -> file-service (one chunk per request; internal API is never proxied)
    location /files/ {
        client_max_body_size 2m;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://file-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Partial uploads are dot-files inside the media tree and must never be served
    location ~ ^/media/.*/\. {
        deny all;
    }

    # Uploaded media (shared volume with the backend and file-service containers)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }
}
