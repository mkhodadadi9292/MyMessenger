x-postgres-admin: &postgres-admin
  POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-dev-admin}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      <<: *postgres-admin
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    volumes:
      - messenger-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_ADMIN_USER:-postgres}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-dev-admin}
      MESSENGER_DB_NAME: ${MESSENGER_DB_NAME:-messenger}
      MESSENGER_DB_USER: ${MESSENGER_DB_USER:-messenger}
      MESSENGER_DB_PASSWORD: ${MESSENGER_DB_PASSWORD:-messenger-dev-password}
      FILE_SERVICE_DB_NAME: ${FILE_SERVICE_DB_NAME:-file_service}
      FILE_SERVICE_DB_USER: ${FILE_SERVICE_DB_USER:-file_service}
      FILE_SERVICE_DB_PASSWORD: ${FILE_SERVICE_DB_PASSWORD:-file-service-dev-password}
    volumes:
      - ./deploy/postgres/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    restart: "no"

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${MESSENGER_DB_USER:-messenger}:${MESSENGER_DB_PASSWORD:-messenger-dev-password}@postgres:5432/${MESSENGER_DB_NAME:-messenger}
      MEDIA_ROOT: /data/media
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789}
      # DEBUG=true keeps the dev OTP helper (GET /api/v1/auth/otp/dev/latest)
      # and prints OTP codes to the backend log. Set to false in production.
      DEBUG: ${DEBUG:-true}
    volumes:
      - messenger-media:/data/media
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - messenger-media:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  messenger-pg:
  messenger-media:
