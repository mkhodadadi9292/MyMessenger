services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    volumes:
      - messenger-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://messenger:messenger@db:5432/messenger
      MEDIA_ROOT: /data/media
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789}
      # DEBUG=true keeps the dev OTP helper (GET /api/v1/auth/otp/dev/latest)
      # and prints OTP codes to the backend log. Set to false in production.
      DEBUG: ${DEBUG:-true}
    volumes:
      - messenger-media:/data/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - messenger-media:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # legacy SQLite volume — kept as a backup after the Postgres migration
  messenger-db:
  messenger-media:
  messenger-pgdata:
